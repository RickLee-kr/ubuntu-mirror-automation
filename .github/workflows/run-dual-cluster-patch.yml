name: Finalize dual cluster GUI validation

on:
  push:
    paths:
      - '.github/workflows/run-dual-cluster-patch.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final consistency fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/install-dp-upgrade-mirror.sh')
          s = p.read_text()
          old = 'Use 7) Save Configuration to persist them.'
          new = 'Use 9) Save Configuration to persist them.'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale Save Configuration reference, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_gui_client_commands.sh')
          s = p.read_text()
          old = '''config_text="Preparation Mode: Full OS Upgrade + Phase 2
ACPS Username: configured
ACPS Password: configured
Worker SSH Password (aella): configured
ACPS Server: Fixed
OS Core Source: Cloudflare R2
'''
          new = '''config_text="Preparation Mode: Full OS Upgrade + Phase 2
Mirror Server IP: 192.0.2.10
ACPS Username: configured
ACPS Password: configured
DL Worker IPs: 192.168.124.23,192.168.124.25
DA Worker IPs: 192.168.124.24,192.168.124.26
Worker SSH Password (aella): configured
ACPS Server: Fixed
OS Core Source: Cloudflare R2
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one config_text fixture, got {s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count('mm_calc_menu_size 7 74 8 "${config_text_lines}"') != 2:
              raise SystemExit('expected two old 7-item config menu size checks')
          s = s.replace('mm_calc_menu_size 7 74 8 "${config_text_lines}"',
                        'mm_calc_menu_size 9 74 8 "${config_text_lines}"')
          p.write_text(s)
          PY

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-dp-upgrade-mirror.sh
          bash -n scripts/lib/mirror_manager_common.sh
          bash -n scripts/lib/mirror_workflow_state.sh
          bash -n lib/bootstrap.sh
          git diff --check
          bash tests/test_gui_client_commands.sh
          bash tests/test_menu7_normal_width_display.sh
          bash tests/test_mirror_manager_menu_status.sh

      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No final consistency changes required'
            exit 0
          fi
          git config user.name 'Rick Lee'
          git config user.email 'rick@rick.kr'
          git add scripts/install-dp-upgrade-mirror.sh tests/test_gui_client_commands.sh
          git commit -m 'test(gui): align dual worker configuration guidance'
          git push
