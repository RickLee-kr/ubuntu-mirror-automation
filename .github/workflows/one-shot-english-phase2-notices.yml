name: One-shot English-only Phase 2 notices

on:
  push:
    branches:
      - chore/english-only-phase2-notices

permissions:
  contents: write

jobs:
  update-notices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/english-only-phase2-notices

      - name: Remove redundant non-English operator notices
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path('vendor/dp-phase2/bringup_py3_dp_after_os_upgrade.sh')
          text = path.read_text(encoding='utf-8')

          # These lines duplicate English guidance immediately adjacent to them.
          # Removing the duplicates keeps the project and runtime output English-only
          # without changing any operational behavior or machine-readable markers.
          lines = [
              '        log "안내: 대용량 로컬 이미지 import는 수십 분 이상 걸릴 수 있습니다."',
              '        log "안내: 이 단계에서는 ctr이 정상 동작 중이어도 별도 출력을 표시하지 않을 수 있습니다."',
              '        log "안내: 중간 로그가 없더라도 bringup을 재실행하거나 containerd를 재시작하거나 VM을 재부팅하지 마십시오."',
              '        log "안내: 작업 중에는 $(image_import_heartbeat_seconds)초마다 진행 상태가 출력됩니다."',
              '    emit_dp_resume_notice_line "안내: OS 업그레이드 전 사전 점검에서 DP 서비스가 pause되었을 수 있습니다."',
              '    emit_dp_resume_notice_line "안내: Phase 2 bringup은 기존 DP pause 상태를 자동으로 해제하지 않습니다."',
              '    emit_dp_resume_notice_line "안내: bringup 실행 중에는 resume을 수행하지 마십시오."',
              '    emit_dp_resume_notice_line "안내: 로그에 \\"Bringup complete:\\"가 출력된 후 aella_cli에서 상태를 확인하십시오."',
              '    emit_dp_resume_notice_line "안내: \\"System paused\\"가 표시되면 resume을 실행해야 DP 서비스가 시작됩니다."',
              '    emit_dp_resume_notice_line "안내: bringup 완료 후에도 DP 제품 서비스는 아직 pause 상태일 수 있습니다."',
              '    emit_dp_resume_notice_line "안내: aella_cli에서 show status로 paused 여부를 먼저 확인하십시오."',
              '    emit_dp_resume_notice_line "안내: \\"System paused\\"이면 resume을 실행하고, pod 기동을 기다린 뒤 다시 확인하십시오."',
          ]

          missing = [line for line in lines if line not in text]
          if missing:
              print('Expected source line(s) not found; refusing an ambiguous edit:', file=sys.stderr)
              for line in missing:
                  print(line, file=sys.stderr)
              sys.exit(1)

          for line in lines:
              text = text.replace(line + '\n', '')

          remaining = [
              (idx, line)
              for idx, line in enumerate(text.splitlines(), 1)
              if re.search(r'[\uac00-\ud7a3]', line)
          ]
          if remaining:
              print('Hangul remains in the Phase 2 vendor script:', file=sys.stderr)
              for idx, line in remaining:
                  print(f'{idx}: {line}', file=sys.stderr)
              sys.exit(1)

          path.write_text(text, encoding='utf-8')
          PY

          bash -n vendor/dp-phase2/bringup_py3_dp_after_os_upgrade.sh

      - name: Commit the one-shot change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-english-phase2-notices.yml
          git add vendor/dp-phase2/bringup_py3_dp_after_os_upgrade.sh
          git diff --cached --check
          git commit -m "chore: make phase2 operator notices English-only"
          git push origin HEAD:chore/english-only-phase2-notices
