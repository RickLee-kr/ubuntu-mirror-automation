name: Apply cluster Phase 2 guidance

on:
  push:
    paths:
      - '.github/workflows/apply-cluster-phase2-guidance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrowly scoped guidance changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # README: make cluster Phase 2 node scope explicit.
          replace_once(
              'README.md',
              '''For clustered deployments, complete the DL cluster first, then run the corresponding process on the DA master with the DA worker IPs.\n\nThe generated commands are also saved at:\n''',
              '''For clustered deployments, complete the DL cluster first, then run the corresponding process on the DA master with the DA worker IPs.\n\n**Cluster Phase 2 execution rule:**\n\n| Step | Where to run |\n| --- | --- |\n| **STEP 6 — STAGE DP 6.5.0 FILES** | Run on the **cluster master and every worker** |\n| **STEP 7 — RUN DP 6.5.0 BRINGUP** | Run on the **cluster master only** |\n\nComplete STEP 6 on the master and all workers before starting STEP 7. When STEP 7 uses `--worker-ips`, do **not** run STEP 7 manually on the workers; the master SSHes to its workers and starts worker bringup automatically. For an AIO/single-node DP, run both steps on that DP.\n\nThe generated commands are also saved at:\n'''
          )

          replace_once(
              'README.md',
              '''4. Stage DP 6.5.0 Phase 2\n5. Run `bringup_py3` using `--skip-download`\n6. Resume DP services\n''',
              '''4. Stage DP 6.5.0 Phase 2 on the master **and every worker**\n5. Run `bringup_py3` using `--skip-download` on the **cluster master only**\n6. Resume DP services\n'''
          )

          # Canonical Menu 7 command text: STEP 6 on all cluster nodes; STEP 7 master only.
          replace_once(
              'scripts/install-dp-upgrade-mirror.sh',
              '''STEP 6 — STAGE DP ${ver} FILES\n------------------------------------------------------------------------\n\n${copy_block_guide}\n''',
              '''STEP 6 — STAGE DP ${ver} FILES\n------------------------------------------------------------------------\n\nCLUSTER: Run STEP 6 on the master AND every worker.\nComplete STEP 6 on all cluster nodes before starting STEP 7.\nAIO/single node: run STEP 6 on that DP only.\n\n${copy_block_guide}\n'''
          )

          replace_once(
              'scripts/install-dp-upgrade-mirror.sh',
              '''STEP 7 — RUN DP ${ver} BRINGUP\n------------------------------------------------------------------------\n\nRun this command on the cluster master only.\n\nComplete the DL cluster first, then run the corresponding command on the DA master using the DA worker IPs.\n''',
              '''STEP 7 — RUN DP ${ver} BRINGUP\n------------------------------------------------------------------------\n\nRun STEP 7 on the cluster MASTER ONLY.\nDo NOT run STEP 7 manually on workers when using --worker-ips.\nThe master SSHes to its workers and starts worker bringup automatically.\n\nComplete the DL cluster first, then run the corresponding command on the DA master using the DA worker IPs.\n'''
          )

          # Regression fixture/assertions for the visible Menu 7 text.
          replace_once(
              'tests/test_menu7_normal_width_display.sh',
              '''STEP 6 — STAGE DP 6.5.0 FILES\n\nCopy all three lines of the following block into the DP terminal once:\n''',
              '''STEP 6 — STAGE DP 6.5.0 FILES\n\nCLUSTER: Run STEP 6 on the master AND every worker.\nComplete STEP 6 on all cluster nodes before starting STEP 7.\nAIO/single node: run STEP 6 on that DP only.\n\nCopy all three lines of the following block into the DP terminal once:\n'''
          )

          replace_once(
              'tests/test_menu7_normal_width_display.sh',
              '''grep -q 'complete Phase 2 client helper unit' "$DISPLAY"\n''',
              '''grep -q 'complete Phase 2 client helper unit' "$DISPLAY"\ngrep -Fq 'CLUSTER: Run STEP 6 on the master AND every worker.' "$DISPLAY"\ngrep -Fq 'Complete STEP 6 on all cluster nodes before starting STEP 7.' "$DISPLAY"\n'''
          )
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-dp-upgrade-mirror.sh
          bash -n tests/test_menu7_normal_width_display.sh
          bash tests/test_menu7_normal_width_display.sh
          bash tests/test_gui_client_commands.sh
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT GitHub Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md scripts/install-dp-upgrade-mirror.sh tests/test_menu7_normal_width_display.sh
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'docs(phase2): clarify cluster stage and bringup scope'
          git push origin HEAD:main
